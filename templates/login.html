<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول النظام | المرادي سوفت</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><link rel="icon" type="image/svg+xml" href="{{url_for('static',filename='logo.svg')}}"></head><body class="login-page"><form class="login-card" method="post"><input type="hidden" name="_csrf_token" value="{{session.get('_csrf_token','')}}"><div class="brand login-brand"><img src="{{url_for('static',filename='logo.svg')}}" alt="شعار المرادي سوفت" style="width:48px;height:48px;border-radius:14px"><div><b>المرادي سوفت</b><small>Accounting & Business Suite</small></div></div><div class="eyebrow">بوابة الدخول</div><h1>مرحبًا بعودتك</h1><p class="muted">سجّل الدخول لإدارة العمليات المالية.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% endwith %}<label>اسم المستخدم</label><input name="username" value="admin" required autocomplete="username"><label>كلمة المرور</label><input name="password" type="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password"><button class="btn primary wide">تسجيل الدخول ←</button><div class="login-note">لبيانات الدخول الأولية راجع ملف README_AR.txt. لا تشارك بيانات المدير.</div></form></body></html>
